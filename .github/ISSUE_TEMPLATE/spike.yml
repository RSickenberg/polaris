name: Spike
description: Time-boxed research to answer one question before building.
labels: ["spike"]
body:
  - type: input
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: e.g. 4 hours
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The evidence that answers the question.
    validations:
      required: true
