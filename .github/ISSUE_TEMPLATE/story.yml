name: Story
description: A user-facing capability, written from the user's point of view.
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions, one per line.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, design references, open questions.
