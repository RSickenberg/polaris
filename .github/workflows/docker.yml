name: Docker

# Builds the production image from the commit a release tag points at and pushes it
# to GHCR as <version> (no "v") and, for a stable release, latest.
#
# Two ways in, never both for one release:
# - "release: published" covers a release published by hand in the GitHub UI.
# - "workflow_call" is used by release.yml: a release created with GITHUB_TOKEN does
#   not start new workflow runs, so release.yml calls this workflow itself.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Skip the latest tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two runs for one version queue instead of racing for the same tags.
concurrency:
  group: docker-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rsickenberg/polaris

jobs:
  # Resolves the tag to a commit once, so both architectures build the same source,
  # and computes the tags and OCI metadata shared by the other jobs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.prerelease }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Resolve the commit and the build time
        id: ref
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=${TAG#v}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Annotations at the index level: a multi-arch image is an index, and GHCR reads
      # the source annotation there to link the package to the repository.
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ref.outputs.version }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
          labels: |
            org.opencontainers.image.title=Polaris
            org.opencontainers.image.description=Tracks a Tesla's odometer against the lease allowance and warns before the limit.
            org.opencontainers.image.source=https://github.com/RSickenberg/polaris
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.created=${{ steps.ref.outputs.created }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          annotations: |
            org.opencontainers.image.title=Polaris
            org.opencontainers.image.description=Tracks a Tesla's odometer against the lease allowance and warns before the limit.
            org.opencontainers.image.source=https://github.com/RSickenberg/polaris
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.created=${{ steps.ref.outputs.created }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Pushed by digest only; the merge job puts the tags on the manifest list.
      # Provenance and SBOM are off: with them the digest would name an index, not an image.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: frankenphp_prod
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          # Read at run time as SENTRY_RELEASE, so error reports name the release (see "Error reporting" in the README).
          build-args: |
            POLARIS_VERSION=${{ needs.prepare.outputs.version }}
            POLARIS_MAINTAINER_DSN=${{ vars.POLARIS_MAINTAINER_DSN }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Create the manifest list
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          ANNOTATIONS: ${{ needs.prepare.outputs.annotations }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the result
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n1 <<< "$TAGS")"
