---
# Development environment override, loaded automatically by "docker compose".
services:
  php:
    image: ${IMAGES_PREFIX:-}polaris-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # The Tailwind binary and the built CSS, written by the "tailwind" service and read here.
      - tailwind:/app/var/tailwind
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: smtp://mailer:1025
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    depends_on:
      mailer:
        condition: service_started

  worker:
    image: ${IMAGES_PREFIX:-}polaris-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: smtp://mailer:1025
    extra_hosts:
      - host.docker.internal:host-gateway

  # Rebuilds the Tailwind CSS whenever a template or the stylesheet changes. Same image as "php",
  # but not its entrypoint, which would also wait for the database and run the migrations.
  tailwind:
    image: ${IMAGES_PREFIX:-}polaris-php-dev
    build:
      context: .
      target: frankenphp_dev
    entrypoint: ["php", "bin/console", "tailwind:build", "--watch"]
    init: true
    working_dir: /app
    volumes:
      - ./:/app
      - /app/var
      - tailwind:/app/var/tailwind
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    # The image healthcheck probes the FrankenPHP server, which this service does not run.
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_healthy

  database:
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  mailer:
    image: axllent/mailpit:v1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  tailwind:
