# Run the published image instead of building it:
#   POLARIS_VERSION=0.4.0 docker compose -f compose.yaml -f compose.image.yaml up -d --wait
# Compose reads POLARIS_VERSION from the shell or from .env, not from .env.local. It has no default: no
# "latest" tag exists until a stable release is published.
services:
  php:
    image: ghcr.io/rsickenberg/polaris:${POLARIS_VERSION:?Set POLARIS_VERSION to the version you run, for example POLARIS_VERSION=0.4.0 (see the releases page)}

  worker:
    image: ghcr.io/rsickenberg/polaris:${POLARIS_VERSION:?Set POLARIS_VERSION to the version you run, for example POLARIS_VERSION=0.4.0 (see the releases page)}
