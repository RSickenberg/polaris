; https://symfony.com/doc/current/performance.html#use-the-opcache-class-preloading
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
opcache.validate_timestamps = 0

; Compile \assert() out: the checks are for development and tests, never for production. php.ini-production already
; sets -1; it is stated here so it cannot change silently (-1 cannot be turned on at run time).
zend.assertions = -1
