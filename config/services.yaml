parameters:
    # Weight of the last-30-days pace in the blended pace of the lease projection, in
    # basis points (6000 = 0.6); the overall pace takes the rest.
    polaris.lease.recent_pace_weight: 6000

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Polaris\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Entity/'

    # Domain/ classes cannot use #[Autowire] (ADR 0001), so the weight is wired here.
    Polaris\Lease\Domain\ProjectionCalculator:
        arguments:
            $recentPaceWeight: !service
                class: Polaris\Lease\Domain\RecentPaceWeight
                factory: ['Polaris\Lease\Domain\RecentPaceWeight', 'fromBasisPoints']
                arguments: ['%polaris.lease.recent_pace_weight%']

when@dev:
    services:
        # Development data (make seed). The fixtures bundle is not installed in production.
        _defaults:
            autowire: true
            autoconfigure: true

        Polaris\Fixtures\:
            resource: '../fixtures/'

when@test:
    services:
        # Without Monolog the framework logger writes to stderr, so every expected 404 or 4xx
        # of a functional test would print an "[error]" line in the PHPUnit output.
        logger:
            class: Psr\Log\NullLogger
        # Nothing injects these yet, so the compiler would remove them before the functional
        # tests can fetch them. Drop the aliases once a controller or command depends on them.
        test.polaris.lease.projection_calculator:
            alias: Polaris\Lease\Domain\ProjectionCalculator
            public: true
        test.polaris.lease.assessment_service:
            alias: Polaris\Lease\Service\LeaseAssessmentService
            public: true
