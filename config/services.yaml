parameters:
    # Weight of the last-30-days pace in the blended pace of the lease projection, in
    # basis points (6000 = 0.6); the overall pace takes the rest.
    polaris.lease.recent_pace_weight: 6000

    # Paths the firewall leaves alone. A pattern that matches nothing in production, where the
    # profiler does not exist and assets are served as files; dev and test open the web debug
    # toolbar, the profiler and the assets that AssetMapper serves through a route.
    polaris.security.open_paths: '^(?!)'

    # First delay before the Fleet API vehicle client retries a 5xx, in milliseconds; it doubles on
    # each retry. Tests set it to 0.
    polaris.tesla.retry_delay_ms: 500

    # What Tesla bills for one wake_up (50 requests per USD, so 0.02), shown in the confirmation dialog.
    # Not a rule of the app: Tesla sets the price (https://developer.tesla.com/docs/fleet-api/billing-and-limits).
    polaris.tesla.wake_cost: 0.02
    polaris.tesla.wake_currency: 'USD'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Polaris\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Entity/'

    # Domain/ classes cannot use #[Autowire] (ADR 0001), so the weight is wired here.
    Polaris\Lease\Domain\ProjectionCalculator:
        arguments:
            $recentPaceWeight: !service
                class: Polaris\Lease\Domain\RecentPaceWeight
                factory: ['Polaris\Lease\Domain\RecentPaceWeight', 'fromBasisPoints']
                arguments: ['%polaris.lease.recent_pace_weight%']

when@dev:
    parameters:
        polaris.security.open_paths: '^/(_profiler|_wdt|assets)/'

    services:
        # Development data (make seed). The fixtures bundle is not installed in production.
        _defaults:
            autowire: true
            autoconfigure: true

        Polaris\Fixtures\:
            resource: '../fixtures/'

when@test:
    parameters:
        polaris.security.open_paths: '^/(_profiler|_wdt|assets)/'
        polaris.tesla.retry_delay_ms: 0

    services:
        # Without Monolog the framework logger writes to stderr, so every expected 404 or 4xx
        # of a functional test would print an "[error]" line in the PHPUnit output.
        logger:
            class: Psr\Log\NullLogger
        # Nothing injects these yet, so the compiler would remove them before the functional
        # tests can fetch them. Drop the aliases once a controller or command depends on them.
        test.polaris.lease.projection_calculator:
            alias: Polaris\Lease\Domain\ProjectionCalculator
            public: true
        test.polaris.lease.assessment_service:
            alias: Polaris\Lease\Service\LeaseAssessmentService
            public: true
        test.polaris.tesla.odometer_reader:
            alias: Polaris\Tesla\Service\TeslaOdometerReader
            public: true
        # Tesla tests replace the HTTP client with a MockHttpClient: no test reaches the network.
        test.polaris.http_client:
            alias: http_client
            public: true
