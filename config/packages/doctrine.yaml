doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'

        # Every date Polaris stores is UTC and hydrates as CarbonImmutable.
        types:
            carbon_date_immutable: Polaris\Shared\Doctrine\Type\CarbonDateImmutableType
            datetime_immutable: Polaris\Shared\Doctrine\Type\CarbonDateTimeImmutableType

        # Introspection maps a PostgreSQL timestamp to the mutable datetime type, which differs from
        # the Carbon type of the mapping: without this, every schema comparison reports a change.
        mapping_types:
            timestamp: datetime_immutable

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # ADR 0001: entities live in each module's Entity/ folder.
        mappings:
            Polaris:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'Polaris'
                alias: Polaris

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
