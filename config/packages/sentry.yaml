# Optional error reporting (docs: "Error reporting" in the README). Production only: the bundle is registered for prod.
# Nothing is sent unless POLARIS_ERROR_REPORTING is "maintainer" or "custom": the DSN is then empty and the SDK is a no-op.
when@prod:
    sentry:
        # polaris_dsn: off -> none, maintainer -> %polaris.sentry.maintainer_dsn%, custom -> SENTRY_DSN
        # (Polaris\Shared\Reporting\ErrorReportingDsnProcessor).
        dsn: '%env(polaris_dsn:POLARIS_ERROR_REPORTING)%'
        register_error_listener: true
        register_error_handler: true

        options:
            environment: '%kernel.environment%'
            # SENTRY_RELEASE is set by the image (the version it was built from).
            release: '%env(default::SENTRY_RELEASE)%'
            # Performance traces. 0 (or a missing DSN) sends none. Never profiling.
            traces_sample_rate: '%env(float:default:polaris.sentry.traces_sample_rate:SENTRY_TRACES_SAMPLE_RATE)%'
            # Warnings and errors written with Monolog (see monolog.yaml).
            enable_logs: true
            # Never forward to a Spotlight sidecar.
            spotlight: false
            # No sentry-trace or baggage header ever leaves for Tesla or any other host.
            trace_propagation_targets: []
            # One scrubber behind four hooks (Polaris\Shared\Reporting).
            before_send: Polaris\Shared\Reporting\EventFilter
            before_send_transaction: Polaris\Shared\Reporting\EventFilter
            before_send_log: Polaris\Shared\Reporting\LogFilter
            before_breadcrumb: Polaris\Shared\Reporting\BreadcrumbFilter
            # Every key is written down; none is left to its default, which collects more.
            data_collection:
                user_info: false
                cookies:
                    mode: 'off'
                http_headers:
                    mode: 'off'
                http_bodies: []
                url_query_params:
                    mode: 'off'
                database_query_data: false
                stack_frame_variables: false
                frame_context_lines: 0
            ignore_exceptions:
                - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
                - Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException
                - Symfony\Component\Security\Core\Exception\AccessDeniedException

        messenger:
            enabled: true
            capture_soft_fails: true
            # One message never sees the scope (user, tags) of the previous one in the worker.
            isolate_context_by_message: true
            isolate_breadcrumbs_by_message: true
