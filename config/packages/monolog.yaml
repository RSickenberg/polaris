monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Everything from info up goes to stderr, where the container runtime collects it. The recipe's
            # fingers_crossed handler is not used: it would drop the info and warning lines (a wake sent, a fetch
            # skipped) unless an error follows.
            main:
                type: stream
                path: php://stderr
                level: info
                channels: ["!deprecation"]
                formatter: monolog.formatter.json
            # Warnings and errors also go to Sentry as logs, once an owner opted in (see "Error reporting" in the
            # README). Without a DSN the SDK drops them: it sends nothing.
            sentry_logs:
                type: service
                id: sentry.monolog.logs_handler
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
