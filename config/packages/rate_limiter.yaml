framework:
    rate_limiter:
        # Asking for a password reset link: 5 requests per client address and hour, whatever the email.
        password_reset:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

        # Refreshing the odometer by hand: one accepted request per vehicle and hour (key: the vehicle id).
        manual_refresh:
            policy: fixed_window
            limit: 1
            interval: '1 hour'
