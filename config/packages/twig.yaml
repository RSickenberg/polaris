twig:
    file_name_pattern: '*.twig'
    form_themes:
        - 'shared/form_theme.html.twig'
    globals:
        # The language switcher lists them.
        enabled_locales: '%kernel.enabled_locales%'
        # The pages that explain how secrets are handled link to the code.
        polaris_source_url: '%polaris.source_url%'
        # The version the image was built from (SENTRY_RELEASE), "dev" for a local build.
        polaris_version: '%env(default:polaris.version_fallback:SENTRY_RELEASE)%'

when@test:
    twig:
        strict_variables: true
